<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="打卡衝衝衝">
<meta name="theme-color" content="#7cc8ff">
<title>上班啟示錄：打卡衝衝衝</title>
<link rel="apple-touch-icon" href="icons/kui-180.png">
<link rel="icon" type="image/png" href="icons/kui-192.png">
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; touch-action: none; overscroll-behavior: none; }
  canvas { display: block; touch-action: none; -webkit-user-drag: none; }
  img { -webkit-user-drag: none; pointer-events: none; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .pill { background: #2c3e57d9; color: #fff; font-weight: 900; border-radius: 24px; }
  #me { position: absolute; left: 10px; top: calc(8px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; }
  #me .face { width: 40px; height: 40px; border-radius: 50%; background: #ffcf8a url(icons/kui-180.png) 50% 28% / 150% no-repeat; border: 3px solid #ffd34d; }
  #me .d { font-size: 22px; line-height: 1; } #me .d small { font-size: 13px; margin-left: 2px; }
  #me .b { font-size: 11px; opacity: .75; margin-top: 3px; }
  #bills { position: absolute; right: 10px; top: calc(8px + env(safe-area-inset-top)); font-size: 21px; padding: 6px 14px 6px 9px; display: flex; align-items: center; gap: 7px; }
  #bills i { display: inline-block; width: 28px; height: 18px; border-radius: 4px; background: linear-gradient(90deg, #36c35d 0 33%, #e3f6c8 33% 67%, #36c35d 67%); box-shadow: 0 2px 0 #1f8a3c; }
  #bills.bump { animation: bump .2s; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  #btns { position: absolute; right: 10px; top: calc(54px + env(safe-area-inset-top)); display: flex; gap: 6px; pointer-events: auto; }
  #btns button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #ffffffd9; font-size: 18px; box-shadow: 0 2px 6px #0002; }
  #ver { position: absolute; left: 12px; bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 10px; color: #2c3e57; opacity: .45; font-weight: 700; }
  #powers { position: absolute; left: 10px; top: calc(60px + env(safe-area-inset-top)); display: flex; gap: 6px; }
  #powers span { background: #fff; border-radius: 14px; padding: 3px 10px; font-weight: 900; font-size: 13px; color: #2c3e57; box-shadow: 0 2px 6px #0002; }
  #powers .dash { background: #ff7a45; color: #fff; }
  /* Kevin 在後面追的警告 */
  #warn { position: absolute; left: 50%; top: calc(100px + env(safe-area-inset-top)); transform: translateX(-50%); background: #e0413b; color: #fff; font-weight: 900; font-size: 14px; padding: 6px 14px 8px; border-radius: 16px; display: none; text-align: center; box-shadow: 0 3px 0 #9b2420; white-space: nowrap; }
  #warn.on { display: block; animation: pulse .5s infinite alternate; }
  #warn .bar { height: 5px; border-radius: 3px; background: #ffffff44; margin-top: 4px; overflow: hidden; } #warn .bar i { display: block; height: 100%; background: #fff; }
  @keyframes pulse { to { transform: translateX(-50%) scale(1.05); } }
  #toast { position: absolute; left: 50%; top: 27%; transform: translate(-50%, -50%) scale(.8); background: #ff7a45; color: #fff; font-weight: 900; font-size: 19px; padding: 9px 20px; border-radius: 16px; opacity: 0; transition: all .25s; white-space: nowrap; box-shadow: 0 4px 0 #c4501f; }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner { --bc: #ff7a45; position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(.3); opacity: 0; text-align: center; pointer-events: none; }
  #banner.on { animation: bannerIn 2.6s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); } 20% { transform: translate(-50%, -50%) scale(1) rotate(0); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(.95); } }
  #banner .b-stars { color: #ffd34d; font-size: 28px; letter-spacing: 4px; text-shadow: 0 3px 0 #b8860b, 0 0 18px #ffd34d; }
  #banner .b-title { font-size: 30px; font-weight: 900; color: #fff; background: var(--bc); padding: 8px 24px; border-radius: 20px; box-shadow: 0 6px 0 #0003, 0 0 40px var(--bc); white-space: nowrap; }
  #banner .b-sub { margin-top: 10px; font-size: 15px; font-weight: 900; color: var(--bc); background: #fff; display: inline-block; padding: 5px 16px; border-radius: 14px; box-shadow: 0 3px 0 #0002; }
  /* 觸控：左半邊滑壘、右半邊跳 */
  #pads { position: fixed; inset: 0; display: flex; }
  #pads > div { flex: 1; position: relative; }
  .key { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); width: 86px; height: 86px; border-radius: 50%; background: #ffffffb0; border: 4px solid #fff; box-shadow: 0 5px 0 #0002; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; color: #2c3e57; font-size: 15px; transition: transform .08s, background .08s; }
  .key b { font-size: 30px; line-height: 1; }
  #padL .key { left: 22px; } #padR .key { right: 22px; }
  .key.on { transform: scale(.9); background: #ffd34dee; }
  body.kb .key { display: none; }
  @media (orientation: landscape) and (max-height: 520px) { .key { width: 66px; height: 66px; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 12px; } .key b { font-size: 24px; } #padL .key { left: calc(14px + env(safe-area-inset-left)); } #padR .key { right: calc(14px + env(safe-area-inset-right)); } }
  #kbHint { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #fffffff0; color: #2c3e57; font-weight: 800; font-size: 14px; padding: 7px 16px; border-radius: 20px; white-space: nowrap; display: none; box-shadow: 0 3px 10px #0002; }
  body.kb #kbHint { display: block; }
  /* 封面、暫停、結算 */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, #fff6e3ee, #ffd9a8f2); z-index: 10; padding: 16px; overflow-y: auto; }
  .screen.on { display: flex; }
  .card { width: min(380px, 100%); text-align: center; color: #2c3e57; }
  .card h1 { margin: 6px 0 2px; font-size: 34px; line-height: 1.1; color: #ff7a45; text-shadow: 0 3px 0 #fff, 0 5px 0 #0001; }
  .card h1 small { display: block; font-size: 17px; color: #2c3e57; margin-bottom: 4px; }
  .card p { margin: 8px 0; font-weight: 700; font-size: 15px; line-height: 1.5; }
  .avatar { width: 128px; height: 128px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 6px 18px #c4501f44; background: #ffcf8a; object-fit: cover; }
  .big { display: block; width: 100%; margin: 12px 0 0; padding: 15px; font-size: 22px; font-weight: 900; color: #fff; background: #ff7a45; border: 0; border-radius: 20px; box-shadow: 0 6px 0 #c4501f; }
  .big:active { transform: translateY(3px); box-shadow: 0 3px 0 #c4501f; }
  .big.sec { background: #3fa7ff; box-shadow: 0 6px 0 #1f6fb8; font-size: 17px; padding: 11px; }
  .howto { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .howto div { background: #fff; border-radius: 14px; padding: 8px 6px; font-weight: 800; font-size: 13px; box-shadow: 0 2px 6px #0001; }
  .howto b { display: block; font-size: 22px; }
  .best { display: inline-block; background: #2c3e57; color: #fff; padding: 4px 14px; border-radius: 12px; font-weight: 900; font-size: 13px; }
  .stats { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
  .stats div { flex: 1; background: #fff; border-radius: 16px; padding: 10px 4px; font-weight: 900; box-shadow: 0 3px 8px #0001; }
  .stats b { display: block; font-size: 26px; color: #ff7a45; }
  .stats small { font-size: 12px; opacity: .7; }
  .newrec { display: none; background: #ffd34d; color: #8a5a00; font-weight: 900; padding: 4px 12px; border-radius: 12px; font-size: 14px; }
  .newrec.on { display: inline-block; animation: pulse2 .6s infinite alternate; }
  @keyframes pulse2 { to { transform: scale(1.08); } }
  .quote { background: #e0413b; color: #fff; display: inline-block; padding: 6px 14px; border-radius: 14px; font-weight: 900; margin-top: 4px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #bfe6ff; z-index: 20; font-weight: 900; color: #2c3e57; font-size: 18px; }
</style>
</head>
<body>
<div id="loading">小葵準備上班中…</div>
<div id="pads"><div id="padL"><div class="key" id="keyL"><b>⬇</b>滑壘</div></div><div id="padR"><div class="key" id="keyR"><b>⬆</b>跳</div></div></div>
<div id="hud">
  <div id="me" class="pill"><div class="face"></div><div><div class="d"><span id="dist">0</span><small>m</small></div><div class="b">最佳 <span id="bestHud">0</span>m</div></div></div>
  <div id="bills" class="pill"><i></i><span id="billN">0</span></div>
  <div id="btns"><button id="bPause" aria-label="暫停">⏸</button><button id="bSound" aria-label="聲音">🔊</button></div>
  <div id="powers"></div>
  <div id="warn">🛹 Kevin 追來了！別再撞到！<div class="bar"><i id="warnBar"></i></div></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="kbHint">空白鍵／↑ 跳（按住跳更高、空中再按二段跳）　↓ 滑壘　P 暫停</div>
  <div id="ver"></div>
</div>

<div class="screen" id="sTitle"><div class="card">
  <img class="avatar" src="icons/kui-512.png" alt="">
  <h1><small>上班啟示錄</small>打卡衝衝衝！</h1>
  <p>08:59，小葵要遲到了！<br>一路往上衝，閃過紙堆、咖啡和 AI 機器人。<br>撞到兩次就會被特助 Kevin 抓去開會…</p>
  <div class="howto"><div><b>⬆</b>點右半邊＝跳<br>空中再點＝二段跳</div><div><b>⬇</b>點左半邊＝滑壘<br>鑽過布條和無人機</div><div><b>☕</b>咖啡<br>衝刺無敵 3 秒</div><div><b>🪪</b>員工證<br>擋一次碰撞</div></div>
  <span class="best" id="bestTitle">最佳紀錄 0 m</span>
  <button class="big" id="bStart">開始衝！</button>
</div></div>

<div class="screen" id="sPause"><div class="card">
  <h1>休息一下</h1>
  <p>喝口水，Kevin 不會趁現在偷襲的。</p>
  <button class="big" id="bResume">繼續衝</button>
  <button class="big sec" id="bQuit">回到封面</button>
</div></div>

<div class="screen" id="sOver"><div class="card">
  <h1 style="font-size:28px">被 Kevin 抓去開會了…</h1>
  <span class="quote">「這個用 AI 就好了。」</span>
  <div class="stats"><div><b id="oDist">0</b><small>公尺</small></div><div><b id="oBills">0</b><small>鈔票</small></div><div><b id="oFloor">1F</b><small>跑到</small></div></div>
  <span class="newrec" id="oNew">🎉 新紀錄！</span>
  <p id="oBest" style="margin-top:6px"></p>
  <button class="big" id="bAgain">再跑一次</button>
  <button class="big sec" id="bHome">回到封面</button>
</div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
<script type="module" src="js/main.js?v=0.1.0"></script>
</body>
</html>
